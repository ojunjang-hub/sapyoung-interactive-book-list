<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사회평론 도서목록</title>
  <!-- 뷰 모드 클래스를 렌더 전에 적용해 내부 요소 깜빡임(FOUC) 방지 -->
  <script>
    (function () {
      try {
        var m = new URLSearchParams(location.search).get('mode');
        if (m === 'internal' || m === 'public') localStorage.setItem('view_mode', m);
        var mode = localStorage.getItem('view_mode') === 'internal' ? 'mode-internal' : 'mode-public';
        document.documentElement.classList.add(mode);
      } catch (e) { document.documentElement.classList.add('mode-public'); }
    })();
  </script>
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>
  <!-- 내부 모드 전용 상단 링크 (공개 모드에서는 숨김) -->
  <div class="landing-topbar internal-only">
    <a href="admin.html" class="nav-link">관리자</a>
  </div>

  <!-- ===== 랜딩 화면 ===== -->
  <main id="landing">

    <div class="landing-hero">
      <h1 class="landing-title"><a href="index.html">사회평론 도서목록</a></h1>
    </div>

    <!-- 섹션 1: 가지치기 파인더 -->
    <section class="finder-section">
      <h2 class="section-title">어떤 책을 찾으세요?</h2>
      <div id="finder-step1" class="finder-step">
        <button class="finder-btn" data-dept="교양">교양</button>
        <button class="finder-btn" data-dept="어린이">어린이</button>
        <button class="finder-btn" data-dept="대학교재·학술">학술</button>
        <div class="all-books-row">
          <button type="button" class="all-books-btn" id="btn-all-books">
            모든 책 목록 보기 <span id="total-count"></span>
          </button>
        </div>
      </div>
      <div id="finder-step2" class="finder-step" style="display:none">
        <button class="finder-back-btn" id="finder-back">← 다시 선택</button>
        <p class="finder-hint" id="finder-hint"></p>
        <div id="finder-categories" class="finder-cat-grid"></div>
      </div>
    </section>

    <!-- 섹션 2: 검색 (일반 / AI 토글) -->
    <section class="prompt-section">
      <div class="search-mode-toggle" role="tablist">
        <button type="button" id="mode-normal" class="search-mode-btn"
                onclick="setSearchMode('normal')">일반 검색</button>
        <button type="button" id="mode-ai" class="search-mode-btn"
                onclick="setSearchMode('ai')">AI 검색</button>
      </div>
      <div class="landing-ai-wrap">
        <div class="ai-search-inner">
          <span class="ai-label" id="ai-label">AI</span>
          <input type="text" id="ai-input"
                 placeholder="제목 · 저자로 검색"
                 onkeydown="if(event.key==='Enter') submitLandingSearch()">
          <button class="ai-btn" onclick="submitLandingSearch()">검색</button>
        </div>
      </div>
      <div class="ai-chips" id="ai-chips">
        <button class="ai-chip" onclick="setAiQuery('국어 교육 기초서')">국어 교육 기초서</button>
        <button class="ai-chip" onclick="setAiQuery('처음 읽는 철학')">처음 읽는 철학</button>
        <button class="ai-chip" onclick="setAiQuery('아이 그림책 추천')">아이 그림책 추천</button>
      </div>
    </section>

    <!-- 섹션 3: 신간 -->
    <section class="newbooks-section">
      <h2 class="section-title">새로 나온 책</h2>
      <div class="newbooks-viewport">
        <button class="newbooks-nav prev hidden" id="newbooks-prev" type="button" aria-label="이전 책 보기">&lsaquo;</button>
        <div class="newbooks-strip" id="newbooks-strip">
          <div class="newbooks-loading">불러오는 중…</div>
        </div>
        <button class="newbooks-nav next hidden" id="newbooks-next" type="button" aria-label="다음 책 보기">&rsaquo;</button>
      </div>
    </section>

  </main>

  <!-- ===== 그리드 뷰 (결과·전체보기) ===== -->
  <div id="grid-view" style="display:none">
    <div class="grid-view-bar">
      <button class="back-to-landing" id="btn-back-landing">← 처음으로</button>
      <span id="grid-view-title" class="grid-view-title"></span>
    </div>

    <div class="ai-status" id="ai-status" style="display:none">
      <span class="ai-spinner"></span> AI가 도서를 분석 중입니다…
    </div>

    <!-- AI 결과 패널 -->
    <div id="ai-result-panel" style="display:none">
      <div class="ai-result-bar">
        <p id="ai-summary" class="ai-summary"></p>
        <button class="ai-back-btn" onclick="showNormalSearch()">필터 검색으로</button>
      </div>
      <div id="ai-grid" class="book-grid-wrap"></div>
    </div>

    <!-- 일반 검색 영역 -->
    <div id="normal-search">
      <div class="toolbar">
        <input type="search" id="search" placeholder="제목 · 저자 검색">
        <select id="filter-department" class="internal-only"><option value="">전체 부서</option></select>
        <select id="filter-category"><option value="">전체 분야</option></select>
        <select id="filter-series"><option value="">전체 시리즈</option></select>
        <select id="filter-year"><option value="">전체 연도</option></select>
        <select id="filter-stock"><option value="">전체 상태</option></select>
        <span class="price-range">
          <input type="number" id="price-min" placeholder="최소가" min="0" step="1000">
          <span>~</span>
          <input type="number" id="price-max" placeholder="최대가" min="0" step="1000">
        </span>
        <select id="sort">
          <option value="pub_date_desc">최신순</option>
          <option value="title_asc">제목순</option>
          <option value="price_asc">가격 낮은순</option>
          <option value="price_desc">가격 높은순</option>
        </select>
        <button id="reset-btn" type="button">초기화</button>
      </div>
      <div class="result-bar">
        <span id="result-count"></span>
        <span class="export-actions">
          <span class="export-label">목록 받기</span>
          <button type="button" class="export-btn" id="export-xlsx" onclick="exportBooks('xlsx')">엑셀</button>
          <button type="button" class="export-btn" id="export-pdf" onclick="exportBooks('pdf')">PDF</button>
        </span>
      </div>
      <div id="book-grid"></div>
    </div>
  </div>

  <script src="config.js?v=3"></script>
  <script src="util.js?v=3"></script>
  <script src="main.js?v=10"></script>
</body>
</html>
